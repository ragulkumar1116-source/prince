<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | CaptureFlex</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="justify-content-center align-items-center">

  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="text-center mb-4">
          <a class="navbar-brand d-inline-flex align-items-center gap-2 mb-2" href="index.html">
            <i class="bi bi-layers-half fs-2 text-gradient"></i>
            <span class="navbar-brand-text fs-2">CaptureFlex</span>
          </a>
          <p class="text-muted small">Create a new account for software downloads & license management</p>
        </div>

        <div class="glass-card p-4 p-md-5">
          <h4 class="fw-bold text-white mb-4 text-center">Create Your Account</h4>

          <form id="register-form" onsubmit="handleRegister(event)">
            <div class="mb-3">
              <label class="form-label text-muted small fw-bold">Full Name</label>
              <input type="text" id="reg-name" class="form-control form-control-cf" placeholder="John Doe" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small fw-bold">Email Address</label>
              <input type="email" id="reg-email" class="form-control form-control-cf" placeholder="john@example.com" required>
            </div>
            <div class="mb-4">
              <label class="form-label text-muted small fw-bold">Password</label>
              <input type="password" id="reg-password" class="form-control form-control-cf" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-cf-primary w-100 mb-3">
              <i class="bi bi-person-plus-fill me-1"></i> Register Account
            </button>
          </form>

          <div class="text-center mt-4 text-muted small">
            Already have an account? <a href="login.html" class="text-gradient fw-bold text-decoration-none">Sign In</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase Web SDK Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    async function handleRegister(event) {
      event.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const pass = document.getElementById('reg-password').value;

      try {
        await CF_AUTH.registerUser(name, email, pass);
        alert("Account created successfully! Welcome to CaptureFlex.");
        window.location.href = 'downloads.html';
      } catch (err) {
        // Handled in auth.js
      }
    }
  </script>
</body>
</html>

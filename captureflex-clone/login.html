<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Login | CaptureFlex</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="justify-content-center align-items-center">

  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="text-center mb-4">
          <a class="navbar-brand d-inline-flex align-items-center gap-2 mb-2" href="index.html">
            <i class="bi bi-layers-half fs-2 text-gradient"></i>
            <span class="navbar-brand-text fs-2">CaptureFlex</span>
          </a>
          <p class="text-muted small">Sign in to your customer downloads or admin portal</p>
        </div>

        <div class="glass-card p-4 p-md-5">
          <h4 class="fw-bold text-white mb-4 text-center">Account Sign In</h4>

          <form id="login-form" onsubmit="handleLogin(event)">
            <div class="mb-3">
              <label class="form-label text-muted small fw-bold">Email Address</label>
              <input type="email" id="login-email" class="form-control form-control-cf" placeholder="name@domain.com" required>
            </div>
            <div class="mb-4">
              <label class="form-label text-muted small fw-bold">Password</label>
              <input type="password" id="login-password" class="form-control form-control-cf" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-cf-primary w-100 mb-3" id="btn-login">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
          </form>

          <div class="text-center mt-4 text-muted small">
            Don't have an account? <a href="register.html" class="text-gradient fw-bold text-decoration-none">Register here</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase Web SDK Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    async function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      
      try {
        const user = await CF_AUTH.loginWithEmailPassword(email, pass);
        if (user.role === 'admin') {
          window.location.href = 'admin/index.html';
        } else {
          window.location.href = 'downloads.html';
        }
      } catch (err) {
        // Handled in auth.js
      }
    }
  </script>
</body>
</html>

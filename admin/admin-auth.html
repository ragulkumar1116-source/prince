<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hidden Admin Portal Authentication | CaptureFlex</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="justify-content-center align-items-center">

  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        
        <!-- Header -->
        <div class="text-center mb-4">
          <a class="navbar-brand d-inline-flex align-items-center gap-2 mb-2" href="../index.html">
            <i class="bi bi-shield-lock-fill fs-2 text-gradient-purple"></i>
            <span class="navbar-brand-text fs-2">CaptureFlex Admin</span>
          </a>
          <p class="text-muted small">Hidden Administrator Authentication Gateway</p>
        </div>

        <div class="glass-card p-4 p-md-5">
          <!-- Auth Mode Tabs -->
          <ul class="nav nav-pills nav-justified mb-4 p-1 glass-card" id="adminAuthTabs" style="border-radius: 12px; background: rgba(0,0,0,0.3);">
            <li class="nav-item">
              <button class="nav-link active text-white fw-bold py-2" id="tab-login-btn" onclick="switchAuthTab('login')">
                <i class="bi bi-box-arrow-in-right me-1"></i> Admin Login
              </button>
            </li>
            <li class="nav-item">
              <button class="nav-link text-muted fw-bold py-2" id="tab-register-btn" onclick="switchAuthTab('register')">
                <i class="bi bi-person-plus-fill me-1"></i> Register Admin
              </button>
            </li>
          </ul>

          <!-- Form 1: Admin Login -->
          <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
            <div class="mb-3">
              <label class="form-label text-muted small fw-bold">Admin Email Address</label>
              <input type="email" id="admin-login-email" class="form-control form-control-cf" placeholder="admin@domain.com" required>
            </div>
            <div class="mb-4">
              <label class="form-label text-muted small fw-bold">Password</label>
              <input type="password" id="admin-login-password" class="form-control form-control-cf" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-cf-purple w-100 py-2 fw-bold">
              <i class="bi bi-speedometer2 me-1"></i> Access Admin Console
            </button>
          </form>

          <!-- Form 2: Admin Register -->
          <form id="admin-register-form" class="d-none" onsubmit="handleAdminRegister(event)">
            <div class="mb-3">
              <label class="form-label text-muted small fw-bold">Administrator Name</label>
              <input type="text" id="admin-reg-name" class="form-control form-control-cf" placeholder="Alex Sterling" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small fw-bold">Admin Email Address</label>
              <input type="email" id="admin-reg-email" class="form-control form-control-cf" placeholder="admin@yourdomain.com" required>
            </div>
            <div class="mb-4">
              <label class="form-label text-muted small fw-bold">Set Password</label>
              <input type="password" id="admin-reg-password" class="form-control form-control-cf" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-cf-primary w-100 py-2 fw-bold">
              <i class="bi bi-shield-check me-1"></i> Register & Initialize Admin Role
            </button>
          </form>

          <div class="text-center mt-4 border-top border-secondary border-opacity-25 pt-3">
            <a href="../index.html" class="text-muted small text-decoration-none">
              <i class="bi bi-arrow-left me-1"></i> Return to Main Website
            </a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Firebase Web SDK Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    function switchAuthTab(mode) {
      const loginForm = document.getElementById('admin-login-form');
      const regForm = document.getElementById('admin-register-form');
      const loginBtn = document.getElementById('tab-login-btn');
      const regBtn = document.getElementById('tab-register-btn');

      if (mode === 'login') {
        loginForm.classList.remove('d-none');
        regForm.classList.add('d-none');
        loginBtn.classList.add('active', 'text-white');
        loginBtn.classList.remove('text-muted');
        regBtn.classList.remove('active', 'text-white');
        regBtn.classList.add('text-muted');
      } else {
        loginForm.classList.add('d-none');
        regForm.classList.remove('d-none');
        regBtn.classList.add('active', 'text-white');
        regBtn.classList.remove('text-muted');
        loginBtn.classList.remove('active', 'text-white');
        loginBtn.classList.add('text-muted');
      }
    }

    async function handleAdminLogin(event) {
      event.preventDefault();
      const email = document.getElementById('admin-login-email').value;
      const pass = document.getElementById('admin-login-password').value;

      try {
        const user = await CF_AUTH.loginAdmin(email, pass);
        alert(`Welcome Admin ${user.name}! Access granted.`);
        window.location.href = 'index.html';
      } catch (err) {
        // Error alert handled in auth.js
      }
    }

    async function handleAdminRegister(event) {
      event.preventDefault();
      const name = document.getElementById('admin-reg-name').value;
      const email = document.getElementById('admin-reg-email').value;
      const pass = document.getElementById('admin-reg-password').value;

      try {
        const newUser = await CF_AUTH.registerAdmin(name, email, pass);
        alert(`Admin account created for ${newUser.name}! Redirecting to dashboard...`);
        window.location.href = 'index.html';
      } catch (err) {
        // Error alert handled in auth.js
      }
    }
  </script>
</body>
</html>
